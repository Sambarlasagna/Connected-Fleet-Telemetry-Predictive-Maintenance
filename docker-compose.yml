services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fleetguard
      POSTGRES_PASSWORD: fleetguard
      POSTGRES_DB: fleetguard
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetguard"]
      interval: 5s
      timeout: 5s
      retries: 15

  seeder:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://fleetguard:fleetguard@postgres:5432/fleetguard
    volumes:
      - ./ml/model:/app/ml/model:ro
      - ./database:/app/database:ro
    command: python /app/database/docker_seed.py
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://fleetguard:fleetguard@postgres:5432/fleetguard
    volumes:
      - ./ml/model:/app/ml/model:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
