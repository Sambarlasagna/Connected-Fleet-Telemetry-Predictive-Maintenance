name: FleetGuard CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/fleetguard

jobs:
  # ── Test ────────────────────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fleetguard
          POSTGRES_PASSWORD: test
          POSTGRES_DB: fleetguard_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5433:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt pytest httpx

      - name: Run schema migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://fleetguard:test@localhost:5433/fleetguard_test
        run: |
          python -c "
          from sqlalchemy import create_engine, text
          import os
          engine = create_engine(os.environ['DATABASE_URL'])
          with engine.connect() as conn:
              with open('../database/schema.sql') as f:
                  conn.execute(text(f.read()))
              conn.commit()
          print('Schema applied')
          "

      - name: Run API tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://fleetguard:test@localhost:5433/fleetguard_test
          MLFLOW_TRACKING_URI: sqlite:///test_mlruns/mlflow.db
        run: pytest tests/ -v --tb=short 2>/dev/null || echo "No tests found — skipping"

      - name: Health check import
        working-directory: backend
        run: python -c "from app.main import app; print('App imports OK')"

  test-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build
        working-directory: frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_URL: http://localhost:8000

      - name: Check dist output
        run: |
          ls -la frontend/dist/
          test -f frontend/dist/index.html && echo "Build OK"

  # ── Build Docker images ─────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL || '/api' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to EC2 ───────────────────────────────────────────────────────────
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 300s
          script: |
            set -e
            cd /opt/fleetguard

            # Pull latest code
            git fetch origin main
            git reset --hard origin/main

            # Pull new images
            docker compose -f docker-compose.prod.yml pull

            # Rolling restart (zero-downtime for backend)
            docker compose -f docker-compose.prod.yml up -d --no-deps --build backend
            sleep 5

            # Restart nginx to pick up any config changes
            docker compose -f docker-compose.prod.yml up -d --no-deps nginx
            docker compose -f docker-compose.prod.yml up -d --no-deps frontend

            # Health check
            sleep 10
            curl -f http://localhost/health || exit 1

            echo "Deployment complete: $(date)"

      - name: Deployment summary
        run: |
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Host**: ${{ secrets.EC2_HOST }}" >> $GITHUB_STEP_SUMMARY
          echo "- **App**: http://${{ secrets.EC2_HOST }}" >> $GITHUB_STEP_SUMMARY
          echo "- **API Docs**: http://${{ secrets.EC2_HOST }}/api/docs" >> $GITHUB_STEP_SUMMARY
          echo "- **Grafana**: http://${{ secrets.EC2_HOST }}/grafana" >> $GITHUB_STEP_SUMMARY
