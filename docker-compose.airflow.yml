# docker-compose.airflow.yml — Airflow stack (add-on to main docker-compose)
#
# Run alongside the main stack:
#   docker compose -f docker-compose.yml -f docker-compose.airflow.yml up -d
#
# Or standalone:
#   docker compose -f docker-compose.airflow.yml up -d
#
# Airflow UI: http://localhost:8080  (admin / fleetguard)

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.2
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://fleetguard:fleetguard@postgres:5432/fleetguard_airflow
    AIRFLOW__CORE__FERNET_KEY: "81HqDtbqAywKSOumSha3BhWNOdQ26slT6K0YaZeZyPs="
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: "fleetguard_airflow_secret"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # FleetGuard environment
    DATABASE_URL: postgresql://fleetguard:fleetguard@postgres:5432/fleetguard
    MLFLOW_TRACKING_URI: sqlite:////opt/fleetguard/mlruns/mlflow.db
    FLEETGUARD_ROOT: /opt/fleetguard
    RETRAIN_MIN_ROWS: "500"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/config:/opt/airflow/config
    # Mount entire project so DAG tasks can call ML scripts
    - .:/opt/fleetguard
  depends_on:
    airflow-postgres:
      condition: service_healthy
  restart: unless-stopped

services:

  airflow-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fleetguard
      POSTGRES_PASSWORD: fleetguard
      POSTGRES_DB: fleetguard_airflow
    volumes:
      - airflow_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetguard -d fleetguard_airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        pip install scikit-learn pandas mlflow sqlalchemy psycopg2-binary pyarrow 2>/dev/null
        airflow db migrate
        airflow users create \
          --username admin \
          --firstname FleetGuard \
          --lastname Admin \
          --role Admin \
          --email admin@fleetguard.local \
          --password fleetguard
        echo "Airflow initialized."
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--hostname", "$(hostname)"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow_pg_data:
